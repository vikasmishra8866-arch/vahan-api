<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Details Lookup</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: var(--primary-color);
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      text-transform: uppercase;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    button {
      padding: 12px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .loader {
      display: none;
      text-align: center;
      margin: 20px 0;
      font-weight: bold;
      color: var(--primary-color);
    }

    .error-card {
      display: none;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }

    .result-card {
      display: none;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row:nth-child(even) {
      background-color: #f8fafc;
    }

    .label {
      font-weight: 600;
      color: #64748b;
    }

    .value {
      font-weight: 600;
      color: var(--text-color);
    }

    .status-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-warning {
      background-color: #fef3c7;
      color: #d97706;
    }

    .status-success {
      background-color: #dcfce7;
      color: #15803d;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Vehicle Detail Lookup</h2>
  
  <div class="search-box">
    <input type="text" id="vehicleNum" placeholder="e.g. MH47BM9865" maxlength="15">
    <button onclick="fetchVehicleDetails()">Search</button>
  </div>

  <div id="loader" class="loader">Fetching Details... Please wait</div>
  <div id="errorMsg" class="error-card"></div>

  <div id="resultCard" class="result-card">
    <div class="info-row">
      <span class="label">Registration No:</span>
      <span class="value" id="resRegNo">-</span>
    </div>
    <div class="info-row">
      <span class="label">RTO Location:</span>
      <span class="value" id="resRto">-</span>
    </div>
    <div class="info-row">
      <span class="label">RTO Code:</span>
      <span class="value" id="resRtoCode">-</span>
    </div>
    <div class="info-row">
      <span class="label">State Code:</span>
      <span class="value" id="resState">-</span>
    </div>
    <div class="info-row">
      <span class="label">Vehicle Category:</span>
      <span class="value" id="resVertical">-</span>
    </div>
    <div class="info-row">
      <span class="label">Individual Owner:</span>
      <span class="value" id="resIndividual">-</span>
    </div>
    <div class="info-row">
      <span class="label">API Status:</span>
      <span class="value" id="resStatus">-</span>
    </div>
  </div>
</div>

<script>
  async function fetchVehicleDetails() {
    const vehicleInput = document.getElementById('vehicleNum').value.trim().toUpperCase();
    const loader = document.getElementById('loader');
    const errorMsg = document.getElementById('errorMsg');
    const resultCard = document.getElementById('resultCard');

    // UI Reset
    errorMsg.style.display = 'none';
    resultCard.style.display = 'none';

    if (!vehicleInput) {
      errorMsg.textContent = 'Kripya gadi number enter karein.';
      errorMsg.style.display = 'block';
      return;
    }

    loader.style.display = 'block';

    try {
      const response = await fetch(`https://cjpindia.vercel.app/api/vehicle-details/${vehicleInput}`);
      
      if (!response.ok) {
        throw new Error(`Server Error: ${response.status}`);
      }

      const data = await response.json();
      
      // Deep Null-Safe Extraction
      const motorReq = data?.premiumRequest?.motorPremiumRequest;
      const regResult = data?.registrationResult;

      // Primary validation check
      if (!motorReq && !regResult) {
        throw new Error('Gadi ki detail nahi mili ya invalid vehicle number.');
      }

      // Values Mapping
      document.getElementById('resRegNo').textContent = motorReq?.registrationNo || regResult?.registrationNo || vehicleInput;
      document.getElementById('resRto').textContent = motorReq?.rtoDesp || regResult?.rto?.lntLoc || 'N/A';
      document.getElementById('resRtoCode').textContent = motorReq?.rtoId || regResult?.rto?.rtoCode || 'N/A';
      document.getElementById('resState').textContent = data?.premiumRequest?.stateCode || regResult?.reg1 || 'N/A';
      document.getElementById('resVertical').textContent = data?.premiumRequest?.vertical || regResult?.vertical || 'N/A';
      document.getElementById('resIndividual').textContent = motorReq?.isIndividual ? 'Yes' : 'No';

      // Status handling
      const statusEl = document.getElementById('resStatus');
      const statusValue = regResult?.status || 'SUCCESS';
      statusEl.textContent = statusValue;
      statusEl.className = 'value status-badge ' + (statusValue === 'WARNING' ? 'status-warning' : 'status-success');

      resultCard.style.display = 'block';

    } catch (err) {
      errorMsg.textContent = err.message || 'Details fetch karne me dikkat aayi.';
      errorMsg.style.display = 'block';
    } finally {
      loader.style.display = 'none';
    }
  }
</script>

</body>
</html>
