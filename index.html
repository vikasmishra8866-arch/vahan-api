<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parivahan Service - Vehicle Detail Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.2) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        .brand-header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-box {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 20px;
            display: flex;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1rem;
            padding-left: 15px;
            text-transform: uppercase;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            text-transform: none;
        }

        .search-box button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 28px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .search-box button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .loader-container {
            display: none;
            text-align: center;
            padding: 50px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-card {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .vehicle-title-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .vehicle-title-badge h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge.warning {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .grid-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .info-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 16px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .info-item:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .info-item label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .info-item span {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-word;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .not-found-card {
            display: none;
            text-align: center;
            padding: 45px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            animation: shake 0.5s ease-in-out;
        }

        .not-found-card i {
            font-size: 3.2rem;
            color: #ef4444;
            margin-bottom: 15px;
        }

        .not-found-card h3 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .not-found-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-header">
            <h1>Parivahan Service</h1>
            <p>Advanced Vehicle Information & Analytics Portal</p>
        </div>

        <div class="search-box">
            <input type="text" id="vehicleNumber" placeholder="Enter Vehicle No. (e.g., GJ05MS9717)" value="GJ05MS9717">
            <button onclick="fetchVehicleData()"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
        </div>

        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p style="color: var(--text-muted);">Fetching vehicle details from server...</p>
        </div>

        <div class="not-found-card" id="notFound">
            <i class="fa-solid fa-circle-exclamation"></i>
            <h3>Details Not Found</h3>
            <p id="errorDesc">The API request took longer than 10 seconds or returned no data.</p>
        </div>

        <div class="result-card" id="resultCard">
            <div class="vehicle-title-badge">
                <h2 id="regNumberTitle">--</h2>
                <span class="badge" id="statusBadge">SUCCESS</span>
            </div>
            <div class="grid-info" id="infoGrid"></div>
        </div>
    </div>

    <script>
        async function fetchVehicleData() {
            let regNo = document.getElementById('vehicleNumber').value.trim().toUpperCase();
            const loader = document.getElementById('loader');
            const notFound = document.getElementById('notFound');
            const resultCard = document.getElementById('resultCard');
            
            if(!regNo) return;

            loader.style.display = 'block';
            notFound.style.display = 'none';
            resultCard.style.display = 'none';

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            const targetUrl = `https://cjpindia.vercel.app/api/vehicle-details/${regNo}`;

            try {
                const response = await fetch(targetUrl, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`Server returned status ${response.status}`);

                const data = await response.json();
                renderVehicleData(data, regNo);

            } catch (error) {
                clearTimeout(timeoutId);
                
                try {
                    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                    const proxyRes = await fetch(proxyUrl);
                    const proxyData = await proxyRes.json();
                    
                    if (proxyData && proxyData.contents) {
                        const parsedData = JSON.parse(proxyData.contents);
                        renderVehicleData(parsedData, regNo);
                        return;
                    }
                } catch (proxyErr) {
                    console.error("Proxy Error:", proxyErr);
                }

                showNotFound("Request timed out or connection blocked.");
            } finally {
                loader.style.display = 'none';
            }
        }

        function showNotFound(msg) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('notFound').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
            if(msg) document.getElementById('errorDesc').innerText = msg;
        }

        function renderVehicleData(data, inputRegNo) {
            document.getElementById('loader').style.display = 'none';
            const resultCard = document.getElementById('resultCard');
            const infoGrid = document.getElementById('infoGrid');
            
            // Extract core details safely checking multiple possible keys
            const reg = data.registrationResult || data;
            const req = data.premiumRequest || {};
            const motorReq = req.motorPremiumRequest || {};

            let regNo = reg.registrationNo || motorReq.registrationNo || inputRegNo;
            document.getElementById('regNumberTitle').innerText = regNo;

            // Badge status handling
            const statusBadge = document.getElementById('statusBadge');
            const statusText = reg.status || (reg.rto ? 'VERIFIED' : 'WARNING');
            statusBadge.innerText = statusText;
            
            if(statusText === "SUCCESS" || statusText === "VERIFIED") {
                statusBadge.className = "badge success";
            } else {
                statusBadge.className = "badge warning";
            }

            // Comprehensive fields list mapping from all parts of JSON
            const fields = [
                { label: 'Owner Name', value: reg.ownerName || `${reg.ownerFirstName || ''} ${reg.ownerLastName || ''}`.trim() || req.customerName },
                { label: 'Maker / Model', value: `${reg.make || motorReq.make || ''} ${reg.model || motorReq.model || ''} (${reg.displayVariant || reg.variant || motorReq.variant || ''})` },
                { label: 'Fuel Type', value: reg.fuel || motorReq.fuel },
                { label: 'Cubic Capacity', value: (reg.cubicCapacity || motorReq.cubicCapacity) ? `${reg.cubicCapacity || motorReq.cubicCapacity} CC` : null },
                { label: 'Registration Date', value: reg.registrationDate || motorReq.registrationDate },
                { label: 'Financier Name', value: reg.financierName },
                { label: 'Chassis Number', value: reg.chasisno || reg.chassisNo },
                { label: 'Engine Number', value: reg.engineno || reg.engineNo },
                { label: 'Body Type', value: reg.bodyType },
                { label: 'Seating Capacity', value: reg.seatingCapacity },
                { label: 'RTO Location', value: reg.rto ? (reg.rto.rtoPlateLntLoc || reg.rto.lntLoc || reg.rto.lntLoc) : (motorReq.rtoDesp ? `${motorReq.rtoId} - ${motorReq.rtoDesp}` : null) },
                { label: 'PUC Valid Date', value: reg.pucValidDate },
                { label: 'Previous Policy No', value: reg.prePolicyNo || motorReq.previousPolicyNumber },
                { label: 'Permanent Address', value: reg.corrAddress || reg.permanentAddress, full: true }
            ];

            let htmlContent = '';
            fields.forEach(item => {
                let val = item.value ? String(item.value).trim() : "";
                if (val && val !== "undefined" && val !== "null" && val !== "()" && val !== "") {
                    htmlContent += `
                        <div class="info-item ${item.full ? 'full-width' : ''}">
                            <label>${item.label}</label>
                            <span>${val}</span>
                        </div>
                    `;
                }
            });

            // Fallback if structured fields are less, print whatever raw info is available
            if (!htmlContent && data) {
                htmlContent = `
                    <div class="info-item full-width">
                        <label>Raw Response Data</label>
                        <span>${JSON.stringify(data)}</span>
                    </div>
                `;
            }

            infoGrid.innerHTML = htmlContent;
            resultCard.style.display = 'block';
        }
    </script>
</body>
</html>
