<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Details Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-lg text-white">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight">VahanVerify</h1>
          <p class="text-xs text-slate-400">Vehicle Info & History Portal</p>
        </div>
      </div>
      <div id="statusIndicator" class="flex items-center text-xs text-slate-300 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg">
        <span class="w-2 h-2 rounded-full bg-slate-400 mr-2" id="statusDot"></span>
        <span id="statusText">Ready</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Search Section -->
    <div class="mb-8 max-w-2xl mx-auto">
      <label class="block text-sm font-semibold text-slate-700 mb-2 text-center sm:text-left">
        Enter Registration Number
      </label>
      <form onsubmit="handleSearch(event)" class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-5 h-5"></i>
          </div>
          <input 
            type="text" 
            id="vehicleInput" 
            placeholder="e.g. MH47BM9865 or DL4SDH5925" 
            required
            class="block w-full pl-11 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-semibold uppercase placeholder-normal placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition"
          />
        </div>
        <button 
          type="submit" 
          id="searchBtn"
          class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold px-6 py-3 rounded-xl shadow-sm transition flex items-center justify-center space-x-2"
        >
          <i data-lucide="search" class="w-5 h-5" id="btnIcon"></i>
          <span>Search Vehicle</span>
        </button>
      </form>
    </div>

    <!-- Content Container -->
    <div id="contentContainer">
      <!-- Loading State -->
      <div id="loadingState" class="hidden flex-col items-center justify-center py-20 text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent mb-4"></div>
        <p class="text-slate-600 font-medium text-lg">Fetching vehicle details...</p>
        <p class="text-xs text-slate-400 mt-1">Checking multiple API endpoints (Fast Race Mode)</p>
      </div>

      <!-- Error / Empty State -->
      <div id="errorState" class="hidden flex-col items-center justify-center py-16 text-center bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <div class="bg-red-50 text-red-500 p-4 rounded-full mb-4">
          <i data-lucide="alert-triangle" class="w-8 h-8"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800 mb-1" id="errorTitle">No Records Found</h3>
        <p class="text-sm text-slate-500 max-w-md mb-6" id="errorMessage">We couldn't retrieve details for this vehicle number. Please verify the input or try again.</p>
      </div>

      <!-- Data Display Section -->
      <div id="dataList" class="hidden space-y-8"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
      <p>&copy; All Rights Reserved | VahanVerify Portal</p>
    </div>
  </footer>

  <!-- Script logic -->
  <script>
    const API_ENDPOINT = "https://cjpindia.vercel.app/api/vehicle-details/";

    function val(value, fallback = 'N/A') {
      if (value === null || value === undefined || value === '' || value === 'NA' || value === 'null') {
        return `<span class="text-slate-400 font-normal">${fallback}</span>`;
      }
      return value;
    }

    // Helper to safely execute JSON fetch with a strict timeout
    async function fetchWithTimeout(url, timeoutMs = 12000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const response = await fetch(url, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          signal: controller.signal
        });
        clearTimeout(id);

        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        
        const contentType = response.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          // If response is HTML or text, parse text to check if it's stringified JSON
          const textData = await response.text();
          return JSON.parse(textData);
        }

        return await response.json();
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    function handleSearch(e) {
      if (e) e.preventDefault();
      const rawInput = document.getElementById('vehicleInput').value;
      const cleanRegNo = rawInput.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();

      if (!cleanRegNo) {
        alert("Please enter a valid vehicle number.");
        return;
      }

      fetchVehicleData(cleanRegNo);
    }

    async function fetchVehicleData(regNo) {
      showLoading(true);
      updateStatus('Searching...', 'bg-yellow-400');

      const targetUrl = `${API_ENDPOINT}${regNo}`;
      
      // Parallel Request URLs
      const requestSources = [
        targetUrl,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
      ];

      let rawResult = null;

      try {
        // Fast-race: Execute calls in parallel, pick the fastest working response
        rawResult = await Promise.any(
          requestSources.map(url => fetchWithTimeout(url, 12000))
        );
      } catch (aggregateError) {
        console.error("All fetch sources failed or timed out:", aggregateError);
      }

      // Extract records safely from varying payload shapes
      let records = [];
      if (rawResult) {
        if (Array.isArray(rawResult)) {
          records = rawResult;
        } else if (typeof rawResult === 'object') {
          if (rawResult.data && Array.isArray(rawResult.data)) {
            records = rawResult.data;
          } else if (rawResult.result && typeof rawResult.result === 'object') {
            records = [rawResult];
          } else if (!rawResult.error && Object.keys(rawResult).length > 0) {
            records = [rawResult];
          }
        }
      }

      showLoading(false);

      if (records.length > 0) {
        updateStatus('Data Found', 'bg-emerald-500');
        renderCards(records);
      } else {
        updateStatus('Not Found / Timeout', 'bg-red-500');
        showError(
          "Details Not Found",
          `API server took too long to respond or has no records for vehicle "${regNo}". Please re-check the registration number or try again in a few moments.`
        );
      }
    }

    function updateStatus(text, dotClass) {
      document.getElementById('statusText').innerText = text;
      const dot = document.getElementById('statusDot');
      dot.className = `w-2 h-2 rounded-full mr-2 ${dotClass}`;
    }

    function showLoading(isLoading) {
      const loading = document.getElementById('loadingState');
      const error = document.getElementById('errorState');
      const list = document.getElementById('dataList');

      if (isLoading) {
        loading.classList.remove('hidden');
        loading.classList.add('flex');
        error.classList.add('hidden');
        error.classList.remove('flex');
        list.classList.add('hidden');
      } else {
        loading.classList.add('hidden');
        loading.classList.remove('flex');
      }
    }

    function showError(title, message) {
      const error = document.getElementById('errorState');
      document.getElementById('errorTitle').innerText = title;
      document.getElementById('errorMessage').innerText = message;
      error.classList.remove('hidden');
      error.classList.add('flex');
    }

    function renderCards(records) {
      const container = document.getElementById('dataList');
      const errorState = document.getElementById('errorState');

      errorState.classList.add('hidden');
      errorState.classList.remove('flex');
      container.classList.remove('hidden');

      container.innerHTML = records.map((item, index) => {
        // Broad field extraction for varying API keys
        const sz = item?.meta_data?.signzy_response?.result || item?.result || item?.data || item || {};
        const cust = item?.customer_details || {};
        const veh = item?.vehicle_details || {};
        const nominee = item?.nominee_details || {};
        const regRes = item?.registrationResult || {};
        const motorReq = item?.premiumRequest?.motorPremiumRequest || {};

        const regNo = item?.registration_number || sz?.regNo || sz?.registration_number || regRes?.registrationNo || motorReq?.registrationNo || 'REGISTRATION N/A';
        const model = sz?.model || sz?.vehicle_model || motorReq?.cvVehicleType || 'Vehicle';
        const manufacturer = sz?.vehicleManufacturerName || sz?.maker || sz?.manufacturer || 'Unknown Brand';
        const ownerName = sz?.owner || sz?.owner_name || cust?.full_name || item?.premiumRequest?.customerName || 'Unknown Owner';
        const status = sz?.status || sz?.rc_status || regRes?.status || 'ACTIVE';

        return `
          <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden transition-all hover:shadow-md">
            
            <!-- Card Header -->
            <div class="bg-slate-900 text-white p-6">
              <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-4">
                  <div class="bg-blue-600/20 text-blue-400 p-3 rounded-xl border border-blue-500/30">
                    <i data-lucide="car" class="w-8 h-8"></i>
                  </div>
                  <div>
                    <div class="flex items-center space-x-3">
                      <h2 class="text-2xl font-black tracking-wider text-amber-400">${regNo}</h2>
                      <span class="badge ${status === 'ACTIVE' || status === 'ACT' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-red-500/20 text-red-400'}">
                        ${status}
                      </span>
                    </div>
                    <p class="text-slate-300 font-medium text-sm mt-0.5">${val(manufacturer)} • ${val(model)}</p>
                  </div>
                </div>

                <div class="flex flex-wrap gap-2">
                  <span class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700">
                    Fuel: <strong class="text-white">${val(sz?.type || sz?.fuel_type)}</strong>
                  </span>
                  <span class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700">
                    Norms: <strong class="text-white">${val(sz?.normsType || sz?.emission_norms)}</strong>
                  </span>
                </div>
              </div>
            </div>

            <!-- Details Body -->
            <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              <!-- Column 1: Owner -->
              <div class="space-y-6">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center">
                    <i data-lucide="user" class="w-4 h-4 mr-1.5 text-blue-600"></i> Owner Information
                  </h3>
                  <div class="space-y-2.5 text-sm">
                    <div class="flex justify-between">
                      <span class="text-slate-500">Name</span>
                      <span class="font-semibold text-slate-800">${val(ownerName)}</span>
                    </div>
                    <div class="flex justify-between">
                      <span class="text-slate-500">Father Name</span>
                      <span class="font-medium text-slate-700">${val(sz?.ownerFatherName || sz?.father_name)}</span>
                    </div>
                    <div class="flex justify-between">
                      <span class="text-slate-500">Owner Serial</span>
                      <span class="font-medium text-slate-700">${val(sz?.ownerCount || sz?.owner_serial_number)}</span>
                    </div>
                  </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center">
                    <i data-lucide="map-pin" class="w-4 h-4 mr-1.5 text-blue-600"></i> Address
                  </h3>
                  <p class="text-xs text-slate-600 leading-relaxed">
                    ${val(sz?.presentAddress || sz?.address || cust?.communication_address?.address_line)}
                  </p>
                </div>
              </div>

              <!-- Column 2: Specs -->
              <div class="space-y-6">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 h-full flex flex-col justify-between">
                  <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center">
                      <i data-lucide="wrench" class="w-4 h-4 mr-1.5 text-blue-600"></i> Technical Specs
                    </h3>
                    <div class="space-y-2.5 text-sm">
                      <div class="flex justify-between">
                        <span class="text-slate-500">Chassis No</span>
                        <span class="font-mono text-xs text-slate-800 bg-slate-200/60 px-1.5 py-0.5 rounded">${val(item?.chassis_number || sz?.chassis || sz?.chassis_number)}</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-500">Engine No</span>
                        <span class="font-mono text-xs text-slate-800 bg-slate-200/60 px-1.5 py-0.5 rounded">${val(item?.engine_number || sz?.engine || sz?.engine_number)}</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-500">Engine CC</span>
                        <span class="font-medium text-slate-700">${val(sz?.vehicleCubicCapacity || sz?.cubic_capacity)} cc</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-500">Color</span>
                        <span class="font-medium text-slate-700">${val(sz?.vehicleColour || sz?.color)}</span>
                      </div>
                    </div>
                  </div>

                  <div class="mt-4 pt-3 border-t border-slate-200">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-medium text-slate-500">Finance Status</span>
                      ${veh?.is_vehicle_financed || sz?.rcFinancer
                        ? `<span class="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">Financed</span>` 
                        : `<span class="text-xs font-bold text-slate-600">N/A</span>`}
                    </div>
                    ${sz?.rcFinancer ? `<p class="text-xs text-slate-500 mt-1">Bank: <span class="font-medium text-slate-700">${sz.rcFinancer}</span></p>` : ''}
                  </div>
                </div>
              </div>

              <!-- Column 3: Insurance & RC -->
              <div class="space-y-6">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                  <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center">
                    <i data-lucide="file-check" class="w-4 h-4 mr-1.5 text-blue-600"></i> Registration Info
                  </h3>
                  <div class="space-y-2.5 text-sm">
                    <div class="flex justify-between">
                      <span class="text-slate-500">Authority</span>
                      <span class="font-medium text-slate-700">${val(sz?.regAuthority || sz?.rto || regRes?.rto?.lntLoc)}</span>
                    </div>
                    <div class="flex justify-between">
                      <span class="text-slate-500">Reg Date</span>
                      <span class="font-medium text-slate-700">${val(sz?.regDate || sz?.registration_date)}</span>
                    </div>
                    <div class="flex justify-between">
                      <span class="text-slate-500">RC Expiry</span>
                      <span class="font-medium text-emerald-600">${val(sz?.rcExpiryDate || sz?.fit_up_to)}</span>
                    </div>
                  </div>
                </div>

                <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                  <h3 class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-3 flex items-center">
                    <i data-lucide="shield" class="w-4 h-4 mr-1.5 text-blue-600"></i> Insurance Details
                  </h3>
                  <div class="space-y-2 text-xs">
                    <div class="flex justify-between">
                      <span class="text-slate-500">Insurer</span>
                      <span class="font-semibold text-slate-800 truncate max-w-[150px]">${val(sz?.vehicleInsuranceCompanyName || sz?.insurance_company)}</span>
                    </div>
                    <div class="flex justify-between">
                      <span class="text-slate-500">Policy No</span>
                      <span class="font-mono text-slate-700">${val(item?.previous_policy_number || sz?.vehicleInsurancePolicyNumber || sz?.policy_number)}</span>
                    </div>
                    <div class="flex justify-between">
                      <span class="text-slate-500">Expiry Date</span>
                      <span class="font-semibold text-slate-800">${val(item?.previous_policy_exp_date || sz?.vehicleInsuranceUpto || sz?.insurance_upto)}</span>
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <!-- Footer -->
            <div class="bg-slate-50 border-t border-slate-200/80 px-6 py-3 flex justify-between items-center text-xs">
              <span class="text-slate-400">Verified status as per database</span>
              <button onclick="toggleRawData('${index}')" class="text-blue-600 hover:text-blue-800 font-medium flex items-center space-x-1">
                <span>View Raw JSON</span>
                <i data-lucide="code" class="w-3.5 h-3.5"></i>
              </button>
            </div>

            <!-- Debug JSON -->
            <div id="raw-json-${index}" class="hidden bg-slate-900 text-slate-200 p-4 font-mono text-xs overflow-x-auto max-h-60 custom-scrollbar border-t border-slate-800">
              <pre>${JSON.stringify(item, null, 2)}</pre>
            </div>

          </div>
        `;
      }).join('');

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function toggleRawData(index) {
      const element = document.getElementById(`raw-json-${index}`);
      if (element) element.classList.toggle('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
