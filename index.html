<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parivahan Service - Vehicle Detail Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: auto;
        }

        /* Header Branding */
        .brand-header {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeInDown 0.8s ease-out;
        }

        .brand-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Search Bar Box */
        .search-box {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 20px;
            display: flex;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1rem;
            padding-left: 15px;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 28px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .search-box button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Loader Animation */
        .loader-container {
            display: none;
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Result View Grid */
        .result-card {
            display: none;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .vehicle-title-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .vehicle-title-badge h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .grid-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .info-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 16px;
            transition: transform 0.3s;
        }

        .info-item:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .info-item label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .info-item span {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* Error / Not Found View */
        .not-found-card {
            display: none;
            text-align: center;
            padding: 50px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            animation: shake 0.5s ease-in-out;
        }

        .not-found-card i {
            font-size: 3.5rem;
            color: #ef4444;
            margin-bottom: 15px;
        }

        .not-found-card h3 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .not-found-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Keyframe Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @media(max-width: 600px) {
            .brand-header h1 { font-size: 1.8rem; }
            .result-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="brand-header">
            <h1>Parivahan Service</h1>
            <p>Advanced Vehicle Information & Analytics Portal</p>
        </div>

        <!-- Search Input Bar -->
        <div class="search-box">
            <input type="text" id="vehicleNumber" placeholder="Enter Vehicle No. (e.g., MH47BM9865)" value="MH47BM9865">
            <button onclick="fetchVehicleData()"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
        </div>

        <!-- Loader Component -->
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p style="color: var(--text-muted);">Fetching secure vehicle records (Timeout in 10s)...</p>
        </div>

        <!-- Details Not Found Component -->
        <div class="not-found-card" id="notFound">
            <i class="fa-solid fa-circle-exclamation"></i>
            <h3>Details Not Found</h3>
            <p>The API request took longer than 10 seconds or returned invalid details.</p>
        </div>

        <!-- Result Card Component -->
        <div class="result-card" id="resultCard">
            <div class="vehicle-title-badge">
                <h2 id="regNumberTitle">--</h2>
                <span class="badge" id="statusBadge">SUCCESS</span>
            </div>
            <div class="grid-info" id="infoGrid">
                <!-- Dynamically injected active fields only (avoiding nulls) -->
            </div>
        </div>
    </div>

    <script>
        async function fetchVehicleData() {
            const regNo = document.getElementById('vehicleNumber').value.trim();
            const loader = document.getElementById('loader');
            const notFound = document.getElementById('notFound');
            const resultCard = document.getElementById('resultCard');
            
            if(!regNo) return;

            // Reset UI states
            loader.style.display = 'block';
            notFound.style.display = 'none';
            resultCard.style.display = 'none';

            // 10 Seconds Timeout Controller
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            try {
                const response = await fetch(`https://cjpindia.vercel.app/api/vehicle-details/${regNo}`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("API Error");
                const data = await response.json();

                if (data && data.registrationResult && data.registrationResult.status === "SUCCESS") {
                    renderVehicleData(data);
                } else {
                    showNotFound();
                }
            } catch (error) {
                clearTimeout(timeoutId);
                showNotFound();
            } finally {
                loader.style.display = 'none';
            }
        }

        function showNotFound() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('notFound').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';
        }

        function renderVehicleData(data) {
            document.getElementById('loader').style.display = 'none';
            const resultCard = document.getElementById('resultCard');
            const infoGrid = document.getElementById('infoGrid');
            
            const reg = data.registrationResult;
            document.getElementById('regNumberTitle').innerText = reg.registrationNo || 'Vehicle Details';
            document.getElementById('statusBadge').innerText = reg.status || 'ACTIVE';

            // Clean, non-null field mapping dictionary
            const fields = [
                { label: 'Owner Name', value: `${reg.ownerFirstName || ''} ${reg.ownerLastName || ''}`.trim() },
                { label: 'Maker / Model', value: `${reg.make} ${reg.model} (${reg.displayVariant || ''})` },
                { label: 'Fuel Type', value: reg.fuel },
                { label: 'Cubic Capacity', value: reg.cubicCapacity ? `${reg.cubicCapacity} CC` : null },
                { label: 'Registration Date', value: reg.registrationDate },
                { label: 'Financier Name', value: reg.financierName },
                { label: 'Chassis Number', value: reg.chasisno },
                { label: 'Engine Number', value: reg.engineno },
                { label: 'Body Type', value: reg.bodyType },
                { label: 'Seating Capacity', value: reg.seatingCapacity },
                { label: 'RTO Location', value: reg.rto ? reg.rto.rtoPlateLntLoc : null },
                { label: 'PUC Valid Date', value: reg.pucValidDate },
                { label: 'Permanent Address', value: reg.corrAddress, full: true }
            ];

            // Render only valid/non-null fields dynamically
            let htmlContent = '';
            fields.forEach(item => {
                if (item.value && item.value !== "undefined" && item.value.trim() !== "") {
                    htmlContent += `
                        <div class="info-item ${item.full ? 'full-width' : ''}">
                            <label>${item.label}</label>
                            <span>${item.value}</span>
                        </div>
                    `;
                }
            });

            infoGrid.innerHTML = htmlContent;
            resultCard.style.display = 'block';
        }

        // Auto load on start for testing with the default vehicle code
        window.onload = () => {
            fetchVehicleData();
        };
    </script>
</body>
</html>
