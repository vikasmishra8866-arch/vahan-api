<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Information Portal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-xl text-white">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight tracking-wide">VahanLookup</h1>
          <p class="text-xs text-slate-400">Vehicle Verification & Details</p>
        </div>
      </div>
      <div id="statusIndicator" class="flex items-center text-xs text-slate-300 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg">
        <span class="w-2 h-2 rounded-full bg-slate-400 mr-2" id="statusDot"></span>
        <span id="statusText">System Ready</span>
      </div>
    </div>
  </header>

  <!-- Main Area -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
    
    <!-- Search Form -->
    <div class="mb-8 max-w-xl mx-auto">
      <form onsubmit="handleSearch(event)" class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i data-lucide="search" class="w-5 h-5"></i>
          </div>
          <input 
            type="text" 
            id="vehicleInput" 
            placeholder="e.g. GJ05HG7801" 
            value="GJ05HG7801"
            required
            class="block w-full pl-11 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-base font-bold uppercase tracking-wider focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition"
          />
        </div>
        <button 
          type="submit" 
          id="searchBtn"
          class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold px-6 py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2"
        >
          <i data-lucide="search" class="w-5 h-5"></i>
          <span>Search</span>
        </button>
      </form>
    </div>

    <!-- Status Views -->
    <div id="contentArea">
      <!-- Loading UI -->
      <div id="loadingState" class="hidden flex-col items-center justify-center py-20 text-center">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent mb-4"></div>
        <p class="text-slate-700 font-semibold text-lg">Fetching Vehicle Details...</p>
        <p class="text-xs text-slate-400 mt-1">Connecting to Government Records Endpoint</p>
      </div>

      <!-- Error / Not Found UI -->
      <div id="errorState" class="hidden flex-col items-center justify-center py-14 text-center bg-white rounded-2xl border border-slate-200 p-8 shadow-sm max-w-lg mx-auto">
        <div class="bg-red-50 text-red-500 p-4 rounded-full mb-4">
          <i data-lucide="alert-circle" class="w-8 h-8"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800 mb-1" id="errorTitle">Details Not Found</h3>
        <p class="text-sm text-slate-500" id="errorMessage">Unable to locate records for this vehicle number. Please verify and try again.</p>
      </div>

      <!-- Main Display Cards -->
      <div id="resultContainer" class="hidden max-w-4xl mx-auto space-y-6"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    <p>&copy; Vehicle Info System | Authorized Verification Portal</p>
  </footer>

  <!-- Script Logic -->
  <script>
    const API_BASE_URL = "https://cjpindia.vercel.app/api/vehicle-details/";

    // Utility to check valid non-null / non-empty values
    function isValid(val) {
      if (val === null || val === undefined || val === '' || val === false || val === 0 || val === '0' || val === 'NA' || val === 'null' || val === '0.0') {
        return false;
      }
      return true;
    }

    // Dynamic Helper Row generator (Only renders if value is valid)
    function renderRow(label, value, isCode = false) {
      if (!isValid(value)) return '';
      return `
        <div class="flex justify-between items-center py-2 border-b border-slate-100 last:border-none text-sm">
          <span class="text-slate-500">${label}</span>
          <span class="${isCode ? 'font-mono bg-slate-100 px-2 py-0.5 rounded text-xs text-slate-800 font-semibold' : 'font-semibold text-slate-800 text-right'}">${value}</span>
        </div>
      `;
    }

    function handleSearch(e) {
      if (e) e.preventDefault();
      const rawInput = document.getElementById('vehicleInput').value;
      const cleanRegNo = rawInput.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();

      if (!cleanRegNo) {
        alert("Please enter a valid registration number.");
        return;
      }

      fetchDetails(cleanRegNo);
    }

    async function fetchDetails(regNo) {
      showState('loading');
      updateStatus('Searching...', 'bg-yellow-400');

      let jsonRes = null;
      const targetUrl = `${API_BASE_URL}${regNo}`;

      // Source URLs for fallback proxy handling
      const sources = [
        targetUrl,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
      ];

      for (let url of sources) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);
          
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const parsed = await res.json();
            if (parsed && typeof parsed === 'object') {
              jsonRes = parsed;
              break;
            }
          }
        } catch (err) {
          console.warn("Source failed:", url, err);
        }
      }

      if (jsonRes) {
        updateStatus('Data Retrieved', 'bg-emerald-500');
        renderVehicleDetails(jsonRes);
      } else {
        updateStatus('Not Found', 'bg-red-500');
        showError("Record Not Found", `No details found for vehicle number "${regNo}". Please check the vehicle number.`);
      }
    }

    function updateStatus(text, dotClass) {
      document.getElementById('statusText').innerText = text;
      document.getElementById('statusDot').className = `w-2 h-2 rounded-full mr-2 ${dotClass}`;
    }

    function showState(state) {
      const loading = document.getElementById('loadingState');
      const error = document.getElementById('errorState');
      const result = document.getElementById('resultContainer');

      loading.classList.add('hidden');
      loading.classList.remove('flex');
      error.classList.add('hidden');
      error.classList.remove('flex');
      result.classList.add('hidden');

      if (state === 'loading') {
        loading.classList.remove('hidden');
        loading.classList.add('flex');
      } else if (state === 'error') {
        error.classList.remove('hidden');
        error.classList.add('flex');
      } else if (state === 'result') {
        result.classList.remove('hidden');
      }
    }

    function showError(title, msg) {
      document.getElementById('errorTitle').innerText = title;
      document.getElementById('errorMessage').innerText = msg;
      showState('error');
    }

    function renderVehicleDetails(data) {
      const container = document.getElementById('resultContainer');
      container.innerHTML = '';

      // Clean Data Extraction from both registrationResult & motorPremiumRequest
      const regRes = data?.registrationResult || {};
      const reqRes = data?.premiumRequest?.motorPremiumRequest || {};

      const regNo = regRes?.registrationNo || reqRes?.registrationNo || 'NO REGISTRATION NO';
      const make = regRes?.make || reqRes?.make || '';
      const model = regRes?.model || reqRes?.model || '';
      const variant = regRes?.displayVariant || reqRes?.variant || '';
      const vehicleTitle = `${make} ${model}`.trim() || 'Vehicle Details';
      
      const ownerName = regRes?.ownerFirstName || data?.premiumRequest?.customerName || '';
      const fuelType = regRes?.fuel || reqRes?.fuel || '';
      const cc = regRes?.cubicCapacity || reqRes?.cubicCapacity || '';
      const regDate = regRes?.registrationDate || reqRes?.registrationDate || '';
      const year = regRes?.year || reqRes?.year || '';
      const rtoLoc = regRes?.rto?.lntLoc || reqRes?.rtoDesp || '';
      const rtoPlate = regRes?.rto?.rtoPlate || reqRes?.rtoId || '';
      const chassis = regRes?.chasisno || '';
      const engine = regRes?.engineno || '';
      const bodyType = regRes?.bodyType || '';
      const seating = regRes?.seatingCapacity || '';
      const pucNo = regRes?.pucNo || '';
      const pucValid = regRes?.pucValidDate || '';
      const policyNo = regRes?.prePolicyNo || reqRes?.previousPolicyNumber || '';

      const address = regRes?.permanentAddress || regRes?.corrAddress || '';

      // Construction of HTML
      const htmlContent = `
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden transition">
          
          <!-- Banner Header -->
          <div class="bg-slate-900 text-white p-6 sm:p-8">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span class="text-xs font-semibold text-blue-400 uppercase tracking-widest bg-blue-950/80 px-2.5 py-1 rounded-md border border-blue-800">
                  Registration Number
                </span>
                <h2 class="text-3xl sm:text-4xl font-black text-amber-400 tracking-wider mt-2">${regNo}</h2>
                <p class="text-slate-300 font-medium text-base mt-1">${vehicleTitle} ${isValid(variant) ? `<span class="text-slate-400 text-sm">(${variant})</span>` : ''}</p>
              </div>

              ${isValid(fuelType) || isValid(cc) ? `
                <div class="flex flex-wrap gap-2 sm:flex-col sm:items-end">
                  ${isValid(fuelType) ? `<span class="bg-slate-800 text-slate-200 border border-slate-700 font-semibold px-3 py-1 rounded-lg text-xs">Fuel: ${fuelType}</span>` : ''}
                  ${isValid(cc) ? `<span class="bg-slate-800 text-slate-200 border border-slate-700 font-semibold px-3 py-1 rounded-lg text-xs">Engine: ${cc} CC</span>` : ''}
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Content Grid -->
          <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Owner & Registration Box -->
            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200/80 space-y-1">
              <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center">
                <i data-lucide="user" class="w-4 h-4 mr-2 text-blue-600"></i> Owner & Registration
              </h3>
              ${renderRow("Owner Name", ownerName)}
              ${renderRow("Registration Date", regDate)}
              ${renderRow("Model Year", year)}
              ${renderRow("RTO Location", rtoLoc)}
              ${renderRow("RTO Code", rtoPlate, true)}
              ${renderRow("Seating Capacity", seating)}
            </div>

            <!-- Technical & Engine Specs -->
            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200/80 space-y-1">
              <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center">
                <i data-lucide="cpu" class="w-4 h-4 mr-2 text-blue-600"></i> Technical Specifications
              </h3>
              ${renderRow("Chassis Number", chassis, true)}
              ${renderRow("Engine Number", engine, true)}
              ${renderRow("Body Type", bodyType)}
              ${renderRow("Cubic Capacity", isValid(cc) ? `${cc} CC` : null)}
              ${renderRow("Vehicle Make", make)}
              ${renderRow("Vehicle Model", model)}
            </div>

            <!-- Compliance, Insurance & PUC -->
            ${(isValid(pucNo) || isValid(pucValid) || isValid(policyNo)) ? `
              <div class="bg-slate-50 p-5 rounded-xl border border-slate-200/80 space-y-1 md:col-span-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center">
                  <i data-lucide="file-check" class="w-4 h-4 mr-2 text-blue-600"></i> Compliance & Documents
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6">
                  ${renderRow("PUC Certificate No.", pucNo, true)}
                  ${renderRow("PUC Expiry Date", pucValid)}
                  ${renderRow("Previous Policy No.", policyNo, true)}
                </div>
              </div>
            ` : ''}

            <!-- Address Details -->
            ${isValid(address) ? `
              <div class="bg-blue-50/40 p-5 rounded-xl border border-blue-100 md:col-span-2">
                <h3 class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2 flex items-center">
                  <i data-lucide="map-pin" class="w-4 h-4 mr-2 text-blue-600"></i> Registered Address
                </h3>
                <p class="text-sm font-medium text-slate-700 leading-relaxed">${address}</p>
              </div>
            ` : ''}

          </div>
        </div>
      `;

      container.innerHTML = htmlContent;
      showState('result');

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      // Auto-fetch default vehicle on first load
      fetchDetails("GJ05HG7801");
    });
  </script>
</body>
</html>
